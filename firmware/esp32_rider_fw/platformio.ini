# One binary carries BOTH balance controllers (since 2026-10-18): the RL policy and the LQR
# full-state loop. Pick at runtime with the firmware command 'ctrl 0' (policy) / 'ctrl 1' (LQR);
# it is accepted only while balancing is disabled, and every telemetry line reports ctrl=POL|LQR.
# Boots as the policy. Build/flash:  pio run -t upload
[platformio]
default_envs = esp32

[env:esp32]
platform = espressif32
board = esp32dev
framework = arduino
upload_port = /dev/ttyUSB0
upload_speed = 460800
monitor_port = /dev/ttyUSB0
monitor_speed = 115200
build_flags =
    -DSERVO_RX_PIN=13
    -DSERVO_TX_PIN=14
lib_deps =
    adafruit/Adafruit NeoPixel @ ^1.12.0
