# Rider broker config -> /etc/mosquitto/conf.d/rider.conf (installed by pi/deploy_bridge.sh).
# Replaces the hand-made conf.d/local.conf that only ever lived on the card (2026-10-19).
#
# 1883: plain MQTT for the Pi services, workstation tools, and (later) the Hover. Mosquitto 2.x is
#       localhost-only without a listener line, so without this file nothing off the Pi can connect.
# 9001: MQTT over WebSockets for the browser control page, and the page itself (http_dir).
#       Open in a browser: http://raspberrypi.local:9001/   (docs/WEB_UI_DESIGN.md)
#
# No login on either listener: local network only (same as before this file existed).
listener 1883
allow_anonymous true

listener 9001
protocol websockets
http_dir /srv/rider-web
